<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLOv8 Vision Dashboard</title>
    <!-- Add Lucide CSS/JS if you aren't loading it globally -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary-color: #00e87a;
            --bg-dark: #070c14;
            --panel-bg: #0b1520;
            --text-main: #c8daea;
            --text-muted: #4a6a88;
            --border: #1e3048;
        }
        body { margin: 0; display: flex; height: 100vh; font-family: 'Courier New', monospace; background: var(--bg-dark); color: var(--text-main); }
        .sidebar { width: 300px; background: var(--panel-bg); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .main-content { flex: 1; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .brand { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; font-weight: bold; color: white; margin-bottom: 10px; }
        .section-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 10px; }
        .control-group select, .control-group input[type="file"] { width: 100%; padding: 8px; background: #000; border: 1px solid var(--border); color: var(--text-main); border-radius: 4px; font-family: inherit; margin-bottom: 15px; }
        .tabs { display: flex; flex-direction: column; gap: 8px; }
        .tab-btn { display: flex; align-items: center; gap: 10px; padding: 10px; background: transparent; border: 1px solid var(--border); color: var(--text-muted); cursor: pointer; border-radius: 4px; text-align: left; transition: all 0.2s; font-family: inherit; }
        .tab-btn.active, .tab-btn:hover { background: rgba(0, 232, 122, 0.1); border-color: var(--primary-color); color: var(--primary-color); }
        .panel { display: none; margin-top: 15px; }
        .panel.active { display: block; }
        .action-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; background: #1a2a3a; border: 1px solid var(--border); color: white; cursor: pointer; border-radius: 4px; transition: all 0.2s; font-family: inherit; }
        .action-btn:hover { background: #2a3a4a; }
        .action-btn.danger:hover { background: rgba(255, 50, 50, 0.2); border-color: red; color: red; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .status-badge { display: flex; align-items: center; gap: 8px; background: rgba(0, 232, 122, 0.1); border: 1px solid var(--primary-color); padding: 8px 12px; border-radius: 6px; color: var(--primary-color); }
        .viewer-container { flex: 1; background: #000; border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; min-height: 400px; position: relative; margin-bottom: 20px; }
        .empty-state { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); }
        #viewer { max-width: 100%; max-height: 100%; display: none; object-fit: contain; }
        
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th { border-bottom: 1px solid var(--border); padding: 12px; color: var(--text-muted); }
        td { border-bottom: 1px solid #111; padding: 12px; }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand">
            <i data-lucide="scan-line" style="color: var(--primary-color);"></i>
            YOLOv8 Vision
        </div>

        <div class="section-title">Configuration</div>
        <div class="control-group">
            <label style="display: block; font-size: 0.875rem; margin-bottom: 0.5rem; color: var(--text-muted);">Assign Pole Number</label>
            <select id="poleSelect" onchange="updatePole()">
                <option value="1">Pole 1</option>
                <option value="2">Pole 2</option>
                <option value="3">Pole 3</option>
                <option value="4">Pole 4</option>
                <option value="5">Pole 5</option>
                <option value="6">Pole 6</option>
                <option value="7">Pole 7</option>
                <option value="8">Pole 8</option>
            </select>
        </div>

        <div class="section-title">Input Source</div>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('webcam')">
                <i data-lucide="video"></i> Live Webcam
            </button>
            <button class="tab-btn" onclick="switchTab('image')">
                <i data-lucide="image"></i> Image Upload
            </button>
            <button class="tab-btn" onclick="switchTab('video')">
                <i data-lucide="film"></i> Video Upload
            </button>
        </div>

        <!-- Dynamic Context Panels -->
        <div id="webcam" class="panel active">
            <div class="control-group" style="background: transparent; border: none; padding: 0;">
                <button class="action-btn" onclick="startWebcam()" style="margin-bottom: 0.5rem;">
                    <i data-lucide="play"></i> Start Feed
                </button>
                <button class="action-btn danger" onclick="stopStream()">
                    <i data-lucide="square"></i> Stop Feed
                </button>
            </div>
        </div>

        <div id="image" class="panel">
            <div class="control-group" style="background: transparent; border: none; padding: 0;">
                <input type="file" id="imageInput" accept="image/*">
                <button class="action-btn" onclick="processImage()">
                    <i data-lucide="cpu"></i> Analyze Image
                </button>
            </div>
        </div>

        <div id="video" class="panel">
            <div class="control-group" style="background: transparent; border: none; padding: 0;">
                <input type="file" id="videoInput" accept="video/*">
                <button class="action-btn" onclick="processVideo()">
                    <i data-lucide="cpu"></i> Analyze Video
                </button>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        
        <!-- Header / Status -->
        <div class="top-bar">
            <div>
                <h2 style="font-size: 1.25rem; margin:0 0 5px 0;">Detection Feed</h2>
                <p style="color: var(--text-muted); font-size: 0.875rem; margin: 0;">Real-time YOLOv8 Inference</p>
            </div>
            <div class="status-badge">
                <i data-lucide="map-pin" size="16"></i>
                Active Pole: <span id="displayPole">1</span>
            </div>
        </div>

        <!-- Viewer -->
        <div class="viewer-container">
            <div class="empty-state" id="emptyState">
                <i data-lucide="monitor-off" size="48" style="margin-bottom: 15px;"></i>
                <p>No active input source. Select a source to begin.</p>
            </div>
            <img id="viewer" src="" alt="YOLOv8 Output feed">
        </div>

        <!-- Logs -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Source</th>
                        <th>Pole ID</th>
                        <th>Detections</th>
                    </tr>
                </thead>
                <tbody id="logTableBody">
                    <!-- Logs injected via JS -->
                </tbody>
            </table>
        </div>
    </main>

<script>
    lucide.createIcons();

    let pollingInterval = null;
    let selectedPole = 1; 

    const viewer = document.getElementById('viewer');
    const emptyState = document.getElementById('emptyState');
    const tbody = document.getElementById('logTableBody');
    const displayPoleEl = document.getElementById('displayPole');

    function updatePole() {
        const selectElement = document.getElementById('poleSelect');
        selectedPole = selectElement.value;
        displayPoleEl.innerText = selectedPole;
    }

    function switchTab(tabId) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
        
        stopStream(); 
    }

    function showViewer(srcStr) {
        emptyState.style.display = 'none';
        viewer.style.display = 'block';
        viewer.src = srcStr;
    }

    function stopStream() {
        viewer.src = "";
        viewer.style.display = "none";
        emptyState.style.display = "flex";
        if (pollingInterval) clearInterval(pollingInterval);
    }

    async function fetchLogs() {
        try {
            const response = await fetch('/api/logs');
            const logs = await response.json();
            
            tbody.innerHTML = logs.map(entry => `
                <tr>
                    <td style="color: var(--text-muted);">${entry.timestamp}</td>
                    <td><strong style="color: var(--text-main);">${entry.source}</strong></td>
                    <td><span style="background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 4px; font-size: 0.75rem;">Pole ${entry.pole_id}</span></td>
                    <td>${entry.summary}</td>
                </tr>
            `).join("");
        } catch (error) {
            console.error("Error fetching logs:", error);
            if(tbody.children.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color: var(--text-muted);">No logs available.</td></tr>`;
            }
        }
    }

    function startWebcam() {
        const sessionId = "webcam_" + Date.now();
        showViewer(`/webcam_feed?session_id=${sessionId}&pole=${selectedPole}`);
        
        if (pollingInterval) clearInterval(pollingInterval);
        pollingInterval = setInterval(fetchLogs, 2000);
    }

    async function processImage() {
        const fileInput = document.getElementById('imageInput');
        if (!fileInput.files.length) return alert("Please select an image file first.");

        const sessionId = "img_" + Date.now();
        const formData = new FormData();
        formData.append("image", fileInput.files[0]);
        formData.append("session_id", sessionId);
        formData.append("pole_id", selectedPole); 

        try {
            const response = await fetch("/process_image", { method: "POST", body: formData });
            const data = await response.json();

            if (data.error) return alert(data.error);
            showViewer("data:image/jpeg;base64," + data.image);
            fetchLogs();
        } catch(e) {
            console.error(e);
            alert("Error processing image.");
        }
    }

    async function processVideo() {
        const fileInput = document.getElementById('videoInput');
        if (!fileInput.files.length) return alert("Please select a video file first.");

        const formData = new FormData();
        formData.append("video", fileInput.files[0]);
        formData.append("pole_id", selectedPole);

        try {
            const uploadResp = await fetch("/upload_video", { method: "POST", body: formData });
            const uploadData = await uploadResp.json();

            if (uploadData.error) return alert(uploadData.error);

            const sessionId = "vid_" + Date.now();
            showViewer(`/video_feed/${uploadData.filename}?session_id=${sessionId}&pole=${selectedPole}`);

            if (pollingInterval) clearInterval(pollingInterval);
            pollingInterval = setInterval(fetchLogs, 2000);
        } catch(e) {
            console.error(e);
            alert("Error uploading video.");
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        fetchLogs();
        updatePole();
    });
</script>

</body>
</html>
